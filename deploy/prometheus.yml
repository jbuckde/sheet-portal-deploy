global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: api
    static_configs:
      - targets: ["api:3000"]
    metrics_path: /metrics

  - job_name: ocr
    static_configs:
      - targets: ["ocr:8080"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: caddy
    static_configs:
      - targets: ["caddy:2019"]
    metrics_path: /caddy-metrics
