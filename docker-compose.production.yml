services:

  # ---------------------------------------------------------------------------
  # Reverse proxy — only service that publishes host ports
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - sheet-net
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_started

  # ---------------------------------------------------------------------------
  # Frontend — compiled Vue PWA served by Caddy (static)
  # ---------------------------------------------------------------------------
  frontend:
    image: ghcr.io/jbuckde/sheet-portal/frontend:latest
    restart: unless-stopped
    networks:
      - sheet-net

  # ---------------------------------------------------------------------------
  # Dex — local OIDC provider (test environment)
  # ---------------------------------------------------------------------------
  dex:
    image: dexidp/dex:v2.41.1
    restart: unless-stopped
    command: dex serve /etc/dex/config.yaml
    volumes:
      - ./deploy/dex-config.yaml:/etc/dex/config.yaml:ro
    networks:
      - sheet-net

  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  api:
    image: ghcr.io/jbuckde/sheet-portal/backend:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
      OCR_SERVICE_URL: http://ocr:8080
      NODE_EXTRA_CA_CERTS: /certs/cert.pem
    volumes:
      - ./certs:/certs:ro
    networks:
      - sheet-net
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
      ocr:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: sheetportal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sheetportal
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sheet-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sheetportal -d sheetportal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Object storage (Garage — S3-compatible)
  # ---------------------------------------------------------------------------
  garage:
    image: dxflrs/garage:v1.0.1
    restart: unless-stopped
    command: ["/garage", "server"]
    environment:
      GARAGE_ALLOW_WORLD_READABLE_CONFIG: "true"
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - garage-meta:/meta
      - garage-data:/data
    networks:
      - sheet-net
    healthcheck:
      test: ["CMD", "/garage", "stats"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Initialises Garage on first boot (idempotent — safe to re-run).
  # After first run: docker compose exec garage /garage key info sheet-portal-key
  # Copy the Key ID and Secret Key into .env as S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY,
  # then restart the api container.
  createbuckets:
    build:
      context: .
      dockerfile: deploy/Dockerfile.garage-init
    restart: "no"
    depends_on:
      garage:
        condition: service_healthy
    environment:
      GARAGE_ALLOW_WORLD_READABLE_CONFIG: "true"
      GARAGE_KEY_NAME: sheet-portal-key
    volumes:
      - ./deploy/garage.toml:/etc/garage.toml:ro
      - ./deploy/garage-init.sh:/garage-init.sh:ro
    networks:
      - sheet-net

  # ---------------------------------------------------------------------------
  # OCR service
  # ---------------------------------------------------------------------------
  ocr:
    image: ghcr.io/jbuckde/sheet-portal/ocr:latest
    restart: unless-stopped
    networks:
      - sheet-net
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Ops — backup + restore
  # ---------------------------------------------------------------------------
  ops:
    image: ghcr.io/jbuckde/sheet-portal/ops:latest
    restart: unless-stopped
    env_file: .env
    environment:
      S3_ENDPOINT: http://garage:3900
      S3_REGION: garage
    volumes:
      - ops-backups:/backups
    networks:
      - sheet-net
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Monitoring
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    networks:
      - sheet-net

  grafana:
    image: grafana/grafana-oss:latest
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/monitoring"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - sheet-net
    depends_on:
      - prometheus

  # ---------------------------------------------------------------------------
  # postgres_exporter — exposes PostgreSQL metrics to Prometheus
  # ---------------------------------------------------------------------------
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: ${DATABASE_URL}
    networks:
      - sheet-net
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # node_exporter — exposes host OS metrics to Prometheus
  # ---------------------------------------------------------------------------
  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    networks:
      - sheet-net

# ---------------------------------------------------------------------------
# Named volumes — never removed by `docker compose down`
# ---------------------------------------------------------------------------
volumes:
  postgres-data:
  garage-meta:
  garage-data:
  caddy-data:
  caddy-config:
  ops-backups:
  prometheus-data:
  grafana-data:

networks:
  sheet-net:
    driver: bridge
